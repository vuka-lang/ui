name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: stable

jobs:
  test:
    name: generated files, vet, race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools.sum
      # The vuka command is the one tools.mod pins: the demos' tests run it,
      # and its module's docs/errors has the diagnostic codes' pages.
      - name: The vuka command
        run: |
          go build -modfile=tools.mod -o "$RUNNER_TEMP/vuka" github.com/vuka-lang/vuka/cmd/vuka/v2
          echo "VUKA=$RUNNER_TEMP/vuka" >> "$GITHUB_ENV"
          echo "VUKA_DIR=$(go list -modfile=tools.mod -m -f '{{.Dir}}' github.com/vuka-lang/vuka/v2)" >> "$GITHUB_ENV"
      - name: The generated Go is what go generate writes
        run: |
          go generate ./...
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; exit 1; fi
      - name: gofmt
        run: |
          bad=$(git ls-files '*.go' | grep -v -e '/testdata/' -e '_vuka\.go$' -e '_vuka_test\.go$' -e '_html\.go$' | xargs gofmt -l)
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi
      - run: go vet ./...
      - name: vukavet
        run: go tool -modfile=tools.mod vukavet -test=false ./...
      - run: go test -race ./...

  fuzz:
    name: fuzz FuzzTreePatch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -run '^$' -fuzz '^FuzzTreePatch$' -fuzztime 30s ./live
      - name: Keep the failing input
        if: failure()
        run: git ls-files --others --exclude-standard | grep '/testdata/fuzz/' | xargs -r tail -n +1
