<div class={classes()} role="status" id={nonEmpty(ID)} ref={nonEmpty(ID)} style={life()}>
  <div class="vk-toast__body">
    if Title != "" {
      <div class="vk-toast__title">{Title}</div>
    }
    {Children}
  </div>
  if !Closed {
    <button type="button" class="vk-toast__close" aria-label="Dismiss" onClick={DismissToast()}>×</button>
  }
</div>
