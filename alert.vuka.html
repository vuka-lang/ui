<div class={classes()} role="alert">
  <div class="vk-alert__body">
    if Title != "" {
      <div class="vk-alert__title">{Title}</div>
    }
    {Children}
  </div>
  if Dismissible {
    <button type="button" class="vk-alert__close" aria-label="Dismiss" onClick={JS.Hide(Closest(".vk-alert"))}>×</button>
  }
</div>
