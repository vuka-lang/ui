<script lang="go">
package examples

import "github.com/vuka-lang/ui/v2"

type TableDemo struct{}

type invoice struct {
	ID     string
	Status string
	Amount string
}

var invoices = []invoice{{"INV001", "Paid", "$250.00"}, {"INV002", "Pending", "$150.00"}, {"INV003", "Unpaid", "$350.00"}}

func (TableDemo) columns() []ui.Column[invoice] {
	return []ui.Column[invoice]{
		{Header: ui.Text("Invoice"), Cell: func(i invoice) ui.Node { return ui.Text(i.ID) }},
		{Header: ui.Text("Status"), Cell: func(i invoice) ui.Node { return ui.Badge{Children: ui.Text(i.Status)} }},
		{Header: ui.Text("Amount"), Cell: func(i invoice) ui.Node { return ui.Text(i.Amount) }, Align: "right"},
	}
}
</script>

<div>
  {ui.Table[invoice]{Columns: columns(), Rows: invoices}}
</div>
