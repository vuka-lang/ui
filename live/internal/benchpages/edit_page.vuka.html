<script lang="go">
package benchpages

import (
	"context"

	"github.com/vuka-lang/ui/v2"
)

// UserForm is the edit dialog's form.
type UserForm struct {
	ui.FormState
	Name  string `validate:"required,max=80"`
	Email string `validate:"required,email"`
	Role  string `validate:"required,oneof=admin editor viewer"`
	Phone string `validate:"max=20"`
	Bio   string `validate:"max=500"`
}

// EditPage is a list of users, each with an Edit button opening a
// server-owned dialog holding the user's form.
type EditPage struct {
	ui.Live
	N       int
	Form    UserForm
	rows    []User
	editing int
}

@ui.Mount
func (p *EditPage) mount(ctx context.Context) error {
	p.rows = Users(p.N)
	return nil
}

func (p *EditPage) Open(id int) {
	for _, u := range p.rows {
		if u.ID == id {
			p.editing = id
			p.Form = UserForm{Name: u.Name, Email: u.Email, Role: u.Role}
		}
	}
}

func (p *EditPage) Close() { p.editing = 0 }

func (p *EditPage) Save(ctx context.Context, f UserForm) error {
	for i := range p.rows {
		if p.rows[i].ID == p.editing {
			p.rows[i].Name, p.rows[i].Email, p.rows[i].Role = f.Name, f.Email, f.Role
		}
	}
	p.editing = 0
	return nil
}
</script>

<main class="content">
  <ul class="users">
    for _, u := range rows {
      <li key={u.ID}><span>{u.Name}</span> <button type="button" onClick={Open(u.ID)}>Edit</button></li>
    }
  </ul>
  <ui.Modal ref="edit" open={editing != 0} onClose={Close} title={ui.Text("Edit user")}>
    if editing != 0 {
      <ui.Form for={Form} onSubmit={Save}/>
    }
  </ui.Modal>
</main>
